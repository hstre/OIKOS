[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oikos"
version = "0.1.0"
description = "OIKOS – Offenes Labor für Wirtschaft und Gesellschaft: stock-flow consistent agent-based economy for institutional experiments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["oikos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
