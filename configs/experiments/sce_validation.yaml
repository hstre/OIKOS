# Empirical prediction test: stated response to a hypothetical 10 % income loss
# (NY Fed Survey of Consumer Expectations, Household Spending module, QSP13new).
#
# PRE-REGISTERED: this file and docs/08_empirischer_bezug.md are committed before
# any Jev request and before any model is evaluated on the test set. Sample,
# split, context, question text, presentations, models, metrics and decision
# rule must not be changed after seeing test results.
name: sce_validation_v1
data:
  raw_dir: data/sce/raw            # downloaded on demand, SHA-256 pinned, not in Git
  processed: data/sce/processed/sce_qsp13.csv
  data_version: "files as of 2026-10-20 (hashes in oikos/empirics/sce.py)"

outcome:
  question: QSP13new
  primary: y3       # full_cut (code 1) | partial_cut (codes 4, 5, 7) | no_cut (codes 2, 3, 6)
  secondary: y7     # all seven answer codes
  nature: stated response to a hypothetical scenario (self-report), not observed behaviour

# Context: core-survey answers of the same month only. Nothing from the spending
# module (where the outcome is asked) and nothing from other waves of the same person.
context_fields:
  - age_group                      # _AGE_CAT
  - education                      # _EDU_CAT
  - household_income_group         # _HH_INC_CAT (pre-tax, last 12 months, USD)
  - employment                     # Q10 (first matching code, fixed order)
  - job_loss_chance_12m            # Q13new, percent; only asked if working
  - expected_income_change_12m     # Q25v2/Q25v2part2, signed percent
  - expected_spending_change_12m   # Q26v2/Q26v2part2, signed percent
  - debt_payment_miss_chance_3m    # Q30new, percent

split:
  hash_salt: oikos-sce-v1
  train_before: 202201      # respondents whose first spending-module wave is before 2022-01
  test_from: 202301         # respondents whose first spending-module wave is 2023-01 or later
  adjustment_from: 201901   # adjustment sample drawn from training respondents with record date >= 2019-01
  adjustment_n: 400
  test_n: 800               # sealed until the registered run; one record per respondent

technical_control:
  n: 40                      # adjustment respondents asked again: 3 other presentations, 1 repeat, 1 placebo
  placebo_field: {survey_panel_code: "K7"}   # irrelevant field added in the placebo request

presentations:
  # option orders (answer codes) and neutral identifiers rotating with the presentation;
  # each respondent gets presentation = hash mod 4 (balanced)
  orders:
    - [1, 2, 3, 4, 5, 6, 7]
    - [7, 6, 5, 4, 3, 2, 1]
    - [3, 4, 5, 6, 7, 1, 2]
    - [6, 7, 1, 2, 3, 4, 5]
  identifiers: [kq, zt, vx, pw, hj, rm, bf]

jev:
  model: typesafe/jev-1.14
  endpoint: https://openrouter.ai/api/alpha/decisions
  timeout_s: 30
  retries: 2

limits:
  max_requests: 1450        # 400 + 800 + 40 x 5 = 1 400
  cost_usd: 0.06            # to be confirmed before the run

models:
  M0_prior: class frequencies of all training respondents
  M1_logit: multinomial logit on the context fields (one-hot categories, numeric fields scaled /100 with missing indicators), L2 = 1.0, fitted on all training respondents
  M2_jev_raw: Jev scores, summed to the three classes, floored at 1e-4 and renormalised
  M3_jev_calibrated: multinomial logit on log M2, fitted on the adjustment sample
  M4_stacked: multinomial logit on [5-fold cross-fitted log M1, log M2], fitted on the adjustment sample

metrics:
  primary: test log loss of M4 minus test log loss of M1 (y3), 95 % bootstrap interval over respondents (2 000 resamples, seed 20261020)
  secondary: [log loss and Brier of M0..M4 (y3), accuracy (y3), log loss for y7 (M0, M1, Jev raw), AUC for "any spending cut" and for "full cut", mean predicted vs observed class shares]

decision_rule:
  added_value: "Jev adds predictive value if the upper end of the 95 % interval of logloss(M4) - logloss(M1) is below 0"
  no_added_value: "otherwise; a lower log loss of M2 or M3 alone is not sufficient"
  technical_control: "report median total-variation distance across presentations, between repeats and for the placebo; if the presentation distance exceeds 0.2 the result is flagged as presentation-sensitive (balanced assignment still averages it)"
