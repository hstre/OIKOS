# Observation-only robustness tests of the Jev budget question (5 tests x 48
# requests, shared cost limit 0.01 USD). Uses the repository secret
# OPENROUTER_API_KEY only in the live step; GitHub masks it in logs.
# Start: push a branch named jev-robust/<anything>.
name: Jev robustness

on:
  workflow_dispatch:
  push:
    branches: ["jev-robust/**"]

permissions:
  contents: write

concurrency:
  group: jev-robustness
  cancel-in-progress: false

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (simulated API responses only)
        run: python -m pytest -q
      - name: Jev robustness tests (live, cost limit 0.01 USD)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m oikos jev-robustness --mode live --cost-limit-usd 0.01 --out results/jev_robustness
      - name: Replay check (no network, no key)
        if: always()
        run: |
          python -m oikos jev-robustness --mode replay --replay-dir results/jev_robustness \
            --out results/jev_robustness_replay
      - name: Commit results
        if: always()
        run: |
          git config user.name "oikos-bot"
          git config user.email "oikos-bot@users.noreply.github.com"
          git add results/jev_robustness results/jev_robustness_replay || true
          git commit -m "Jev robustness tests (${GITHUB_RUN_ID})" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-robustness
          path: results/jev_robustness*
